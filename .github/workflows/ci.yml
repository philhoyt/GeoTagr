name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit

      - name: Lint (phpcs)
        run: composer run lint

      - name: Static analysis (phpstan)
        run: composer run analyse

  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Unit tests (Jest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  test:
    name: E2E + PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (for wp-env)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build
        run: npm run build

      - name: Start wp-env
        run: npm run env:start

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # E2E must run before PHPUnit: the PHPUnit bootstrap reinstalls the
      # tests site and leaves it with no active plugin.
      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 7

      - name: PHPUnit
        run: npm run test:php
